name: CI Automated Code Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Lint, Test and Security Audit
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: secure-spa-app/package-lock.json

      - name: Install dependencies
        working-directory: secure-spa-app
        run: npm ci

      - name: Run ESLint
        working-directory: secure-spa-app
        run: npm run lint

      - name: Run Automated Test Suite (Jest + Supertest)
        working-directory: secure-spa-app
        run: npm test

      - name: Security Audit Check
        working-directory: secure-spa-app
        run: npm audit --audit-level=critical
